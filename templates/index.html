<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <h1 class="text-2xl font-bold mb-6 text-center text-sky-400">Weather Dashboard</h1>
        
        <div class="flex gap-2 mb-6">
            <input type="text" id="cityInput" placeholder="Enter city name..." 
                class="flex-1 px-4 py-2 bg-slate-900 border border-slate-600 rounded-lg focus:outline-none focus:border-sky-400 text-white">
            <button onclick="getWeather()" 
                class="px-5 py-2 bg-sky-500 hover:bg-sky-600 font-semibold rounded-lg transition">
                Search
            </button>
        </div>

        <p id="errorMsg" class="text-red-400 text-center mb-4 hidden"></p>

        <div id="weatherCard" class="hidden bg-slate-900 p-6 rounded-xl border border-slate-700 text-center">
            <h2 id="cityName" class="text-2xl font-bold text-sky-300 mb-2"></h2>
            <div class="text-5xl font-black mb-4"><span id="temp"></span>°C</div>
            <p id="description" class="text-lg capitalize text-slate-300 mb-4"></p>
            <div class="flex justify-around text-sm text-slate-400 border-t border-slate-800 pt-4">
                <p>Humidity: <span id="humidity" class="text-white font-medium"></span>%</p>
                <p>Wind: <span id="wind" class="text-white font-medium"></span> m/s</p>
            </div>
        </div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const weatherCard = document.getElementById('weatherCard');

            errorMsg.classList.add('hidden');
            weatherCard.classList.add('hidden');

            if (!city) {
                errorMsg.textContent = "Please enter a city name.";
                errorMsg.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch('/get-weather', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ city: city })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Something went wrong");
                }

                document.getElementById('cityName').textContent = `${data.name}, ${data.sys.country}`;
                document.getElementById('temp').textContent = Math.round(data.main.temp);
                document.getElementById('description').textContent = data.weather[0].description;
                document.getElementById('humidity').textContent = data.main.humidity;
                document.getElementById('wind').textContent = data.wind.speed;

                weatherCard.classList.remove('hidden');

            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
